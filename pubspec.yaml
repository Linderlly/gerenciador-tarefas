name: gerenciador_tarefas

description: Aplicativo de gerenciamento de tarefas com recompensas

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  table_calendar: ^3.0.9
  audioplayers: ^6.8.1
  vibration: ^3.1.3
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^22.3.0
  intl: ^0.20.3
  cached_network_image: ^3.4.0
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.1
  permission_handler: ^11.4.0  # ← RECOMENDADO

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon.png
    - assets/sounds/